<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preston Robotics</title>
  <meta name="description" content="Preston Robotics is developing robotics and related technologies for the greater good.">
  <style>
    :root {
      --text: #111111;
      --muted: #555555;
      --line: #dddddd;
      --bg: #ffffff;
    }

    body {
      margin: 0;
      font-family: "Bell MT", Georgia, serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.55;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 72px 24px;
    }

    h1 {
      font-size: 2rem;
      margin: 0 0 8px;
      font-weight: 700;
    }

    .tagline {
      font-size: 1.05rem;
      color: var(--muted);
      margin: 0 0 32px;
    }

    section {
      border-top: 1px solid var(--line);
      padding-top: 24px;
      margin-top: 24px;
    }

    h2 {
      font-size: 1rem;
      margin: 0 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    p {
      margin: 0 0 14px;
    }

    a {
      color: inherit;
    }

    footer {
      border-top: 1px solid var(--line);
      margin-top: 40px;
      padding-top: 18px;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>PRESTON ROBOTICS</h1>

    <section>
      <h2>About</h2>
      <p>Preston Robotics is developing robotics and related technologies for the greater good.</p>
    </section>

    <footer>
      <p>&copy; 2026 Preston Robotics, Inc.</p>
    </footer>
  </main>
</body>
</html>
